<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="毎日の宅トレを記録できるカレンダーアプリ">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="宅トレカレンダー">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>宅トレカレンダー</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /*
      iOSの「ホーム画面に追加」(スタンドアロンPWA)モードで発生する
      タッチ判定ズレ・オーバースクロール干渉を防ぐための調整。
    */
    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      position: fixed;
      /* iOSのゴムのようなバウンススクロールを無効化 */
      overscroll-behavior: none;
      -webkit-overflow-scrolling: auto;
      touch-action: manipulation;
    }

    #flutter_target, flutter-view, flt-glass-pane {
      height: 100%;
      width: 100%;
    }
  </style>

  <style>
    /*
      Flutterの描画領域(タップ判定がズレる可能性がある領域)の外側、
      プレーンなHTML/CSSレイヤーとして常駐する「位置調整」ボタン。
      Flutterのcanvasに依存しないため、Flutter側のタップ判定ズレの
      影響を受けず、常に確実にタップできる。
    */
    #ios-pwa-fix-button {
      position: fixed;
      /* 右下はFlutter側の「+」FABと重なるため、左下に配置する */
      left: 14px;
      bottom: calc(14px + env(safe-area-inset-bottom, 0px));
      z-index: 2147483647;
      display: none;
      align-items: center;
      gap: 6px;
      padding: 10px 16px;
      border: none;
      border-radius: 999px;
      background: #4ECDC4;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.22);
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    #ios-pwa-fix-button:active {
      background: #3fb6ae;
    }
    #ios-pwa-fix-toast {
      position: fixed;
      left: 50%;
      bottom: calc(74px + env(safe-area-inset-bottom, 0px));
      transform: translateX(-50%);
      z-index: 2147483647;
      display: none;
      padding: 8px 16px;
      border-radius: 999px;
      background: rgba(30, 30, 30, 0.85);
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
      font-size: 12px;
      white-space: nowrap;
    }
    #ios-pwa-fix-input {
      position: fixed;
      /* 画面内(表示範囲内)に置く。iOSは完全に画面外や極端に小さい要素
         へのfocus()ではキーボードを表示しないことがあるため、実際に
         視認できる程度のサイズ・位置に配置する */
      left: 50%;
      bottom: 70px;
      transform: translateX(-50%);
      width: 10px;
      height: 36px;
      opacity: 0.01;
      border: none;
      padding: 0;
      font-size: 16px;
      z-index: 2147483646;
    }
  </style>

  <script>
    /*
      iOS「ホーム画面に追加」(スタンドアロンPWA)モード限定の既知のFlutter/WebKit不具合対策。
      参考: https://github.com/flutter/flutter/issues/115829
            https://github.com/flutter/flutter/issues/111896

      現象: 起動直後、Flutter Web側のタップ判定位置が実際の表示位置より
      上にズレてしまう。これは「見えないダミー要素へのfocus()」や
      「合成のresizeイベント」、「TextFieldを含むが実際にはフォーカス
      されていないシートの表示」では解消できないことを実機検証で確認済み。

      実際に解消するのは、ユーザーが「実在する入力欄に本物のタップで
      フォーカス→ソフトキーボードを実際に開閉する」という操作のみ
      (記録シートの数値欄をタップしてから✓で閉じると直る)。

      対策: Flutterのcanvas(タップ判定がズレる領域)の外側、プレーンな
      HTML要素として「位置調整」ボタンを常駐させる。このボタンは
      Flutterの影響を受けないため常に正しい位置でタップできる。
      ボタンタップ(=本物のユーザージェスチャー)をトリガーとして、
      画面内に実在する小さな入力欄に同期的にfocus()し、実際にソフト
      キーボードを開かせ、その後blur()して閉じることで、ユーザーが
      手動操作で発見した「効果のある操作」を確実に再現する。
    */
    (function () {
      const isIos =
        /iPad|iPhone|iPod/.test(navigator.userAgent) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      const isStandalone =
        window.navigator.standalone === true ||
        window.matchMedia('(display-mode: standalone)').matches;

      if (!isIos || !isStandalone) {
        return;
      }

      const resetViewportScroll = () => {
        requestAnimationFrame(() => {
          try {
            window.scrollTo(0, 0);
            if (document.documentElement) {
              document.documentElement.scrollTop = 0;
            }
            if (document.body) {
              document.body.scrollTop = 0;
            }
          } catch (e) {
            /* no-op */
          }
        });
      };

      // document.body に依存する処理は、body が確実に存在するタイミング
      // (DOMContentLoaded後、または既に読み込み済みならすぐ)で実行する。
      // <head>内でこのスクリプトが実行される時点では document.body は
      // まだ null であり、ここで直接 document.body.xxx を呼ぶと
      // TypeError が発生しIIFE全体が停止してしまうため注意。
      const runWhenBodyReady = (fn) => {
        if (document.body) {
          try {
            fn();
          } catch (e) {
            /* no-op: 個別の初期化失敗が他の初期化を止めないようにする */
          }
          return;
        }
        document.addEventListener(
          'DOMContentLoaded',
          () => {
            try {
              fn();
            } catch (e) {
              /* no-op */
            }
          },
          { once: true }
        );
      };

      const installTouchWorkaround = () => {
        const noop = () => {};
        try {
          window.addEventListener('touchstart', noop, {
            capture: true,
            passive: true,
          });
          document.addEventListener('touchstart', noop, {
            capture: true,
            passive: true,
          });
        } catch (e) {
          /* no-op */
        }
        // document.body が必要な部分だけ遅延実行する
        runWhenBodyReady(() => {
          document.body.addEventListener('touchstart', noop, {
            capture: true,
            passive: true,
          });
        });
      };

      let fixInput = null;
      const getFixInput = () => {
        if (fixInput) return fixInput;
        fixInput = document.createElement('input');
        fixInput.id = 'ios-pwa-fix-input';
        fixInput.setAttribute('type', 'text');
        fixInput.setAttribute('inputmode', 'numeric');
        fixInput.setAttribute('aria-hidden', 'true');
        fixInput.setAttribute('autocomplete', 'off');
        fixInput.setAttribute('autocorrect', 'off');
        fixInput.setAttribute('autocapitalize', 'off');
        fixInput.setAttribute('spellcheck', 'false');
        document.body.appendChild(fixInput);
        return fixInput;
      };

      let toastEl = null;
      const getToast = () => {
        if (toastEl) return toastEl;
        toastEl = document.createElement('div');
        toastEl.id = 'ios-pwa-fix-toast';
        toastEl.textContent = '表示位置を調整しました';
        document.body.appendChild(toastEl);
        return toastEl;
      };
      const showToast = () => {
        const toast = getToast();
        toast.style.display = 'block';
        window.setTimeout(() => {
          toast.style.display = 'none';
        }, 1800);
      };

      let fixInProgress = false;
      // 本物のユーザージェスチャー(ボタンタップ)を起点に、実在する
      // 入力欄へ同期的にfocus()してソフトキーボードを実際に開かせ、
      // 少し待ってからblur()で閉じる。これにより、iOS/WebKit側の
      // ビューポート計算が正しくリセットされ、タップ判定ズレが解消する。
      const runRealKeyboardCycle = (onDone) => {
        if (fixInProgress) {
          if (onDone) onDone();
          return;
        }
        fixInProgress = true;
        const input = getFixInput();
        try {
          input.value = '';
          // ボタンのclickハンドラ内(=本物のユーザージェスチャー内)で
          // 同期的に呼ぶことで、iOSがソフトキーボードを実際に表示する
          input.focus({ preventScroll: true });
        } catch (e) {
          /* no-op */
        }

        const finish = () => {
          try {
            input.blur();
          } catch (e) {
            /* no-op */
          }
          resetViewportScroll();
          fixInProgress = false;
          if (onDone) onDone();
        };

        // キーボードのアニメーション完了を待つため、visualViewportの
        // リサイズを検知できればそれを使い、できなければタイムアウトで
        // フォールバックする
        let settled = false;
        const onViewportResize = () => {
          if (settled) return;
          settled = true;
          window.setTimeout(finish, 250);
        };
        if (window.visualViewport) {
          window.visualViewport.addEventListener('resize', onViewportResize, {
            once: true,
          });
        }
        window.setTimeout(() => {
          if (!settled) {
            settled = true;
            finish();
          }
        }, 500);
      };

      installTouchWorkaround();
      resetViewportScroll();

      // Flutterのcanvasに依存しない、プレーンHTMLの「位置調整」ボタンを
      // 常駐表示する。Flutter側のタップ判定ズレの影響を受けないため、
      // 常に確実にタップできる。
      const ensureFixButton = () => {
        let btn = document.getElementById('ios-pwa-fix-button');
        if (btn) return btn;
        btn = document.createElement('button');
        btn.id = 'ios-pwa-fix-button';
        btn.type = 'button';
        btn.textContent = '表示位置を調整';
        btn.addEventListener(
          'click',
          (event) => {
            event.preventDefault();
            runRealKeyboardCycle(() => {
              showToast();
            });
          },
          { passive: false }
        );
        document.body.appendChild(btn);
        return btn;
      };

      const showFixButton = () => {
        const btn = ensureFixButton();
        btn.style.display = 'flex';
      };

      // ページ読み込み後に一度だけボタンを表示する。このボタン自体は
      // Flutterの影響を受けないため、いつタップしても確実に機能する。
      runWhenBodyReady(showFixButton);

      try {
        window.addEventListener('pageshow', resetViewportScroll);
        window.addEventListener('resize', resetViewportScroll);
        window.addEventListener('orientationchange', resetViewportScroll);
        document.addEventListener('visibilitychange', () => {
          if (!document.hidden) {
            resetViewportScroll();
          }
        });

        if (window.visualViewport) {
          window.visualViewport.addEventListener('resize', resetViewportScroll);
        }
      } catch (e) {
        /* no-op */
      }
    })();
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
