<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="毎日の宅トレを記録できるカレンダーアプリ">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="宅トレカレンダー">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>宅トレカレンダー</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /*
      iOSの「ホーム画面に追加」(スタンドアロンPWA)モードで発生する
      タッチ判定ズレ・オーバースクロール干渉を防ぐための調整。
    */
    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      position: fixed;
      /* iOSのゴムのようなバウンススクロールを無効化 */
      overscroll-behavior: none;
      -webkit-overflow-scrolling: auto;
      touch-action: manipulation;
    }

    #flutter_target, flutter-view, flt-glass-pane {
      height: 100%;
      width: 100%;
    }
  </style>

  <script>
    /*
      iOS「ホーム画面に追加」(スタンドアロンPWA)モード限定の既知のFlutter/WebKit不具合対策。
      参考: https://github.com/flutter/flutter/issues/115829
            https://github.com/flutter/flutter/issues/111896

      現象: TextFieldにフォーカス→フォーカスアウトした後、iOS側が「見えないキーボード」の
      分だけビューポート高さを内部的に確保し続けてしまい、画面下部の要素(FloatingActionButton や
      リンクなど)がタップ判定を受け付けなくなる。この不具合はiOS PWA(ホーム画面追加後の
      スタンドアロン起動)でのみ発生し、Safari/Chromeのブラウザタブ表示やAndroidでは発生しない。

      対策: passiveなtouchstartリスナーを登録して不要なジェスチャー競合を減らし、
      フォーカスアウト・画面表示復帰・リサイズ等のタイミングで
      document/visualViewportのスクロール位置を強制的にリセットすることで、
      iOSが誤って保持しているビューポートのズレを解消する。
    */
    (function () {
      const isIos =
        /iPad|iPhone|iPod/.test(navigator.userAgent) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      const isStandalone =
        window.navigator.standalone === true ||
        window.matchMedia('(display-mode: standalone)').matches;

      if (!isIos || !isStandalone) {
        return;
      }

      const resetViewportScroll = () => {
        requestAnimationFrame(() => {
          window.scrollTo(0, 0);
          document.documentElement.scrollTop = 0;
          document.body.scrollTop = 0;
        });
      };

      // フォーカスアウト後、iOSが「見えないキーボード」状態を握り続けている場合に
      // activeElementのフォーカスを明示的に外し、ビューポートのズレをリセットする
      const forceBlurAndReset = () => {
        const active = document.activeElement;
        if (
          active &&
          active !== document.body &&
          typeof active.blur === 'function'
        ) {
          active.blur();
        }
        resetViewportScroll();
      };

      const installTouchWorkaround = () => {
        const noop = () => {};
        window.addEventListener('touchstart', noop, {
          capture: true,
          passive: true,
        });
        document.addEventListener('touchstart', noop, {
          capture: true,
          passive: true,
        });
        document.body.addEventListener('touchstart', noop, {
          capture: true,
          passive: true,
        });
      };

      installTouchWorkaround();
      resetViewportScroll();

      window.addEventListener('pageshow', resetViewportScroll);
      window.addEventListener('resize', resetViewportScroll);
      window.addEventListener('orientationchange', resetViewportScroll);
      window.addEventListener('focusout', forceBlurAndReset, true);
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) {
          resetViewportScroll();
        }
      });

      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', resetViewportScroll);
      }
    })();
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
