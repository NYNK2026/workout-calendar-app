<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="毎日の宅トレを記録できるカレンダーアプリ">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="宅トレカレンダー">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>宅トレカレンダー</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /*
      iOSの「ホーム画面に追加」(スタンドアロンPWA)モードで発生する
      タッチ判定ズレ・オーバースクロール干渉を防ぐための調整。
    */
    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      position: fixed;
      /* iOSのゴムのようなバウンススクロールを無効化 */
      overscroll-behavior: none;
      -webkit-overflow-scrolling: auto;
      touch-action: manipulation;
    }

    #flutter_target, flutter-view, flt-glass-pane {
      height: 100%;
      width: 100%;
    }
  </style>

  <script>
    /*
      iOS「ホーム画面に追加」(スタンドアロンPWA)モード限定の既知のFlutter/WebKit不具合対策。
      参考: https://github.com/flutter/flutter/issues/115829
            https://github.com/flutter/flutter/issues/111896

      現象: TextFieldにフォーカス→フォーカスアウトした後、iOS側が「見えないキーボード」の
      分だけビューポート高さを内部的に確保し続けてしまい、画面下部の要素(FloatingActionButton や
      リンクなど)がタップ判定を受け付けなくなる。この不具合はiOS PWA(ホーム画面追加後の
      スタンドアロン起動)でのみ発生し、Safari/Chromeのブラウザタブ表示やAndroidでは発生しない。

      また、起動直後は逆に「タップ判定位置が実際の表示位置より上にズレる」という
      症状で現れることも確認している。これは合成のresizeイベント発火だけでは直らず、
      「本物のフォーカス→ブラーのサイクル」(=キーボード表示/非表示に伴うWebKit内部の
      ビューポート再計算)を一度経由することで解消される(記録シート内のTextFieldを
      操作すると直っていたのはこのため)。

      対策:
      1. passiveなtouchstartリスナーを登録して不要なジェスチャー競合を減らす
      2. 画面外に見えないダミーのinput要素を用意し、起動直後・最初のタップ操作時に
         実際にfocus()→blur()させることで、本物のフォーカス/ブラーサイクルを
         人工的に発生させ、WebKit側のビューポート計算を正しい状態にリセットする
    */
    (function () {
      const isIos =
        /iPad|iPhone|iPod/.test(navigator.userAgent) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      const isStandalone =
        window.navigator.standalone === true ||
        window.matchMedia('(display-mode: standalone)').matches;

      if (!isIos || !isStandalone) {
        return;
      }

      const resetViewportScroll = () => {
        requestAnimationFrame(() => {
          window.scrollTo(0, 0);
          document.documentElement.scrollTop = 0;
          document.body.scrollTop = 0;
        });
      };

      const installTouchWorkaround = () => {
        const noop = () => {};
        window.addEventListener('touchstart', noop, {
          capture: true,
          passive: true,
        });
        document.addEventListener('touchstart', noop, {
          capture: true,
          passive: true,
        });
        document.body.addEventListener('touchstart', noop, {
          capture: true,
          passive: true,
        });
      };

      // 画面外に配置する、見た目に影響しないダミーのinput要素を作成する。
      // これに実際にfocus/blurさせることで、iOSの「本物の」キーボード
      // 表示/非表示サイクルを経由させ、ビューポート計算のズレを解消する。
      let dummyInput = null;
      const getDummyInput = () => {
        if (dummyInput) return dummyInput;
        dummyInput = document.createElement('input');
        dummyInput.setAttribute('type', 'text');
        dummyInput.setAttribute('aria-hidden', 'true');
        dummyInput.setAttribute('tabindex', '-1');
        dummyInput.style.position = 'fixed';
        dummyInput.style.top = '-1000px';
        dummyInput.style.left = '0';
        dummyInput.style.width = '1px';
        dummyInput.style.height = '1px';
        dummyInput.style.opacity = '0';
        dummyInput.style.border = 'none';
        dummyInput.style.padding = '0';
        // iOSが自動ズームしないよう16px以上を指定
        dummyInput.style.fontSize = '16px';
        dummyInput.style.pointerEvents = 'none';
        document.body.appendChild(dummyInput);
        return dummyInput;
      };

      // フォーカスアウト後、iOSが「見えないキーボード」状態を握り続けている場合に
      // activeElementのフォーカスを明示的に外し、ビューポートのズレをリセットする
      const forceBlurAndReset = () => {
        const active = document.activeElement;
        if (
          active &&
          active !== document.body &&
          typeof active.blur === 'function'
        ) {
          active.blur();
        }
        resetViewportScroll();
      };

      let cycleInProgress = false;
      // 本物のフォーカス→ブラーサイクルを人工的に発生させ、WebKitの
      // ビューポート計算を正しい状態に強制リセットする
      const runFocusBlurCycle = (callback) => {
        if (cycleInProgress) {
          if (callback) callback();
          return;
        }
        cycleInProgress = true;
        try {
          const input = getDummyInput();
          input.focus({ preventScroll: true });
          window.setTimeout(() => {
            input.blur();
            resetViewportScroll();
            cycleInProgress = false;
            if (callback) callback();
          }, 60);
        } catch (e) {
          cycleInProgress = false;
          if (callback) callback();
        }
      };

      installTouchWorkaround();
      resetViewportScroll();

      // 起動直後、複数のタイミングでフォーカス/ブラーサイクルを実行し、
      // Flutter側のレイアウト確定タイミングのズレを吸収する
      [50, 300, 700, 1200, 2000].forEach((delay) => {
        window.setTimeout(() => runFocusBlurCycle(), delay);
      });

      // Flutter Webが初回フレームを描画したタイミングでも実行する
      window.addEventListener('flutter-first-frame', () => {
        runFocusBlurCycle();
        window.setTimeout(() => runFocusBlurCycle(), 400);
      });

      // ユーザーが最初に画面をタップした瞬間にも一度だけ実行する
      // (実際のユーザー操作を伴うことで、iOS側の制約下でも確実に
      //  フォーカスサイクルが機能するようにするフォールバック)
      let firstTouchHandled = false;
      document.addEventListener(
        'touchstart',
        () => {
          if (firstTouchHandled) return;
          firstTouchHandled = true;
          runFocusBlurCycle();
        },
        { capture: true, passive: true }
      );

      window.addEventListener('pageshow', () => runFocusBlurCycle());
      window.addEventListener('resize', resetViewportScroll);
      window.addEventListener('orientationchange', () => runFocusBlurCycle());
      window.addEventListener('focusout', forceBlurAndReset, true);
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) {
          runFocusBlurCycle();
        }
      });

      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', resetViewportScroll);
      }
    })();
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
